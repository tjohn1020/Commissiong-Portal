<script>
    const form = document.querySelector('form');
    const completeRoomButton = document.querySelector('#completeRoom');
    const submitReportButton = document.querySelector('#submitReport');
    const reportStatus = document.querySelector('#reportStatus');
    const reportStorageKey = 'pulseconnect-commissioning-report';
    let rooms = loadRooms();

    function loadRooms() {
        try {
            return JSON.parse(sessionStorage.getItem(reportStorageKey)) || [];
        } catch (error) {
            return [];
        }
    }

    function saveRooms() {
        sessionStorage.setItem(reportStorageKey, JSON.stringify(rooms));
    }

    function collectRoom() {
        const details = [];

        Array.from(form.children).forEach((section) => {
            if (section.matches('div')) {
                const label = section.querySelector(':scope > label');
                const control = section.querySelector('input, select');

                if (!label || !control) {
                    return;
                }

                const value = control.type === 'checkbox'
                    ? (control.checked ? 'Yes' : 'No')
                    : (control.value || '(blank)');
                details.push(`${label.textContent.trim()}: ${value}`);
            }

            if (section.matches('fieldset')) {
                const title = section.querySelector('legend').textContent.trim();
                const controls = Array.from(section.querySelectorAll('.checkbox-group label'))
                    .map((label) => {
                        const input = label.querySelector('input');
                        const name = label.textContent.trim();
                        return `${name}: ${input.checked ? 'Yes' : 'No'}`;
                    });
                details.push(`${title}: ${controls.join(', ')}`);
            }
        });

        return details;
    }

    function clearRoomFields() {
        form.querySelectorAll('input[type="text"]').forEach((input) => {
            input.value = '';
        });
        form.querySelectorAll('input[type="checkbox"]').forEach((input) => {
            input.checked = false;
        });
        form.querySelectorAll('input[type="color"]').forEach((input) => {
            input.value = '#000000';
        });
    }

    function updateStatus(message) {
        reportStatus.textContent = message;
    }

    function resetReport() {
        rooms = [];
        saveRooms();
        updateStatus('0 rooms recorded. Ready for a new report.');
    }

    function createReport() {
        const header = [
            'PulseConnect Systems Commissioning Report',
            `Generated: ${new Date().toLocaleString()}`,
            `Rooms completed: ${rooms.length}`,
            ''
        ];
        const roomSections = rooms.flatMap((room, index) => [
            `ROOM ${index + 1}`,
            ...room,
            ''
        ]);
        return [...header, ...roomSections].join('\n');
    }

    function downloadReport(report) {
        const file = new Blob([report], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(file);
        link.download = `pulseconnect-commissioning-report-${new Date().toISOString().slice(0, 10)}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
    }

    completeRoomButton.addEventListener('click', () => {
        rooms.push(collectRoom());
        saveRooms();
        clearRoomFields();
        updateStatus(`${rooms.length} room${rooms.length === 1 ? '' : 's'} recorded. Ready for the next room.`);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    submitReportButton.addEventListener('click', () => {
        if (rooms.length === 0) {
            updateStatus('Complete at least one room before submitting the report.');
            return;
        }

        const report = createReport();
        const roomCount = rooms.length;
        downloadReport(report);
        resetReport();
        const subject = encodeURIComponent(`PulseConnect Commissioning Report - ${roomCount} rooms`);
        const body = encodeURIComponent(report);
        const mailto = `mailto:tyler.johnson@pulseconnectsystems.com?subject=${subject}&body=${body}`;

        if (mailto.length < 60000) {
            window.location.href = mailto;
            updateStatus('Report downloaded and email draft opened.');
        } else {
            updateStatus('Report downloaded. It is too large for an email link; attach the downloaded file to your email.');
        }
    });

    form.addEventListener('submit', (event) => event.preventDefault());
    updateStatus(`${rooms.length} room${rooms.length === 1 ? '' : 's'} recorded.`);
</script>
